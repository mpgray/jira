[project]
name = "jira-automation"
version = "0.1.0"
description = "Terminal menus for daily Jira ticket updates, time logging and sprint status."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jira>=3.10.5",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
